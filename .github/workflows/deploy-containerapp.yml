name: Deploy Backend (Azure Container Apps)

# Deploys caretrack-backend to Azure Container Apps (cost-optimized alternative to App Service).
#
# SETUP (one-time, done by you in GitHub + Azure):
#   1. Follow docs/DEPLOYMENT.md to create infrastructure
#   2. In GitHub: repo Settings -> Secrets and variables -> Actions, add:
#        SECRETS:
#          - AZURE_CREDENTIALS           = Service principal JSON for Azure CLI login
#          - ACR_USERNAME                = Azure Container Registry username
#          - ACR_PASSWORD                = Azure Container Registry password
#        VARIABLES:
#          - AZURE_RESOURCE_GROUP        = your resource group name (e.g., caretrack-rg)
#          - AZURE_CONTAINER_APP_NAME    = your container app name (e.g., caretrack-api)
#          - ACR_LOGIN_SERVER            = your ACR server (e.g., caretrackacr.azurecr.io)
#          - ACR_REPOSITORY              = image repository name (e.g., caretrack-api)
#   3. Run database migrations separately (this workflow does NOT migrate).
#
# Triggered manually to avoid surprise production deploys. Switch to the
# `push` trigger below once you trust the pipeline.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["caretrack-backend/**", ".github/workflows/deploy-containerapp.yml"]

permissions:
  contents: read
  id-token: write  # Required for Azure login

concurrency:
  group: deploy-containerapp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Container Apps
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: caretrack-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./caretrack-backend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}:latest
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}:latest
          cache-to: type=inline

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}:${{ github.sha }}

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          echo "Testing health endpoint at https://${APP_URL}/api/health?deep=1"
          
          # Retry up to 5 times (container might be scaling from zero)
          for i in {1..5}; do
            if curl -f -s "https://${APP_URL}/api/health?deep=1" | grep -q "ok"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done
          
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Azure Logout
        if: always()
        run: az logout
